format = 1
[language]
reflection = "opt-in"
prelude = true
[build]
default_profile = "Debug"
target = "host"
incremental = true
parallel = true
[profiles.Debug]
optimization = "none"
debug_info = true
[profiles.Release]
optimization = "aggressive"
debug_info = false
[run]
working_directory = "."
arguments = []
